[build]
  command = "mkdir -p dist && (cp waitlist/index.html dist/index.html 2>/dev/null || cp index.html dist/index.html) && cp waitlist/admin.html dist/admin.html && test -f dist/index.html"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  # Keep Blobs unbundled so Netlify injects site context (no SITE_ID/TOKEN needed)
  external_node_modules = ["@netlify/blobs"]

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/signup"
  status = 200
  force = true

[[redirects]]
  from = "/api/visit"
  to = "/.netlify/functions/visit"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

[[redirects]]
  from = "/email-preview"
  to = "/.netlify/functions/email-preview"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'"
