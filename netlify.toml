[build]
  command = "mkdir -p dist && cp waitlist/index.html dist/index.html"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."waitlist"]
  included_files = ["waitlist/email_welcome.html", "waitlist/email_welcome.txt"]

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200
  force = true

[[redirects]]
  from = "/email-preview"
  to = "/.netlify/functions/email-preview"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
