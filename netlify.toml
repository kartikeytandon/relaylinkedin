[build]
  # Works whether Netlify base directory is repo root or /waitlist
  command = "mkdir -p dist && (cp waitlist/index.html dist/index.html 2>/dev/null || cp index.html dist/index.html) && test -f dist/index.html"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."signup"]
  included_files = ["netlify/email-templates/**"]

[functions."email-preview"]
  included_files = ["netlify/email-templates/**"]

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/signup"
  status = 200
  force = true

[[redirects]]
  from = "/email-preview"
  to = "/.netlify/functions/email-preview"
  status = 200
  force = true

# SPA-safe: never show Netlify 404 for the homepage
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Block Netlify public HUD ("Powered by Netlify") — allows inline app JS only
    Content-Security-Policy = "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'"
